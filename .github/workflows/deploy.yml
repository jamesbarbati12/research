name: Deploy site + market news screener

# Publishes to the `gh-pages` branch, kept separate from `main` so the
# ~every-15-minutes automated screener refresh doesn't clutter the commit
# history of the actual portfolio content. GitHub Pages should be
# configured (Settings -> Pages) to serve from `gh-pages` / root.
#
# Runs on a schedule (refresh the screener snapshot) and on every push to
# main (deploy resume/report edits immediately). Public repos get unlimited
# Actions minutes on standard runners, so the 15-minute cadence costs
# nothing - but GitHub may delay or occasionally skip scheduled runs under
# load, and disables `schedule` triggers automatically after 60 days with
# no commits to the repo (a `workflow_dispatch` run or any push resets that).

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: market-news-screener
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest one live snapshot
        working-directory: market-news-screener
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/run_once.py

      - name: Export static snapshot (feed.json / tier-table.json / tickers.json)
        working-directory: market-news-screener
        run: python scripts/export_static.py

      - name: Install frontend dependencies
        working-directory: market-news-screener/frontend
        run: npm ci

      - name: Determine repo name
        id: repo
        run: echo "name=$(basename "${{ github.repository }}")" >> "$GITHUB_OUTPUT"

      - name: Build frontend in static mode
        working-directory: market-news-screener/frontend
        env:
          VITE_STATIC_MODE: "true"
          VITE_BASE_PATH: "/${{ steps.repo.outputs.name }}/screener/"
        run: npm run build

      - name: Assemble the published site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -r reports _site/
          cp "James Barbati Resume 2026.pdf" _site/ 2>/dev/null || true
          mkdir -p _site/screener
          cp -r market-news-screener/frontend/dist/* _site/screener/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        working-directory: _site
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy: refresh site $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin gh-pages
